[package]
name = "pdfpack"
description = "PDFPack: comprime PDFs e organiza anexos por email"
version = "0.1.3"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-optimize = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-render = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui = { workspace = true, features = ["default_fonts"] }
rfd = { workspace = true }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = "3"
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
